let dayKey, theme, currentVidIdx = 0, isPlaying = false, isDJSpeaking = false;
let trackStartTime = 0, progressTimer = null, nextTimer = null;

// DOM
const biliPlayer = document.getElementById('biliPlayer');

const isLocalProxy = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1' || window.location.hostname.startsWith('192.168.');

function mmss(sec){
  const s=Math.max(0,Math.floor(sec));
  return `${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;
}

function getVideo(){
  const vids = theme.videos;
  return vids[((currentVidIdx%vids.length)+vids.length)%vids.length];
}

function initDay(){
  const d = new Date();
  dayKey = DAYS[d.getDay()];
  theme = THEMES[dayKey];
  themeTag.textContent = theme.name + ' · ' + theme.desc;
  infoText.textContent = DAY_NAMES[d.getDay()] + ' · ' + theme.name;
  currentVidIdx = 0;
  updateTrackDisplay(getVideo());
}

function updateClock(){
  const now = new Date();
  clockEl.textContent = now.getHours().toString().padStart(2,'0') + ':' + now.getMinutes().toString().padStart(2,'0');
}
updateClock();
setInterval(updateClock, 30000);

function updateTrackDisplay(v){
  trackTitle.textContent = v.title;
  trackArtist.textContent = v.artist;
  document.title = `${theme.name} — Francis Jazz FM`;
  timeTotal.textContent = mmss(v.dur);
}

BV1DCt6zpECu:31553945627,BV1TTqnBfEkq:34816658728,BV1XJ411w7TB:117333211,
BV1XkBRYjEqL:27059687044,BV1GV4y1o7gk:1107105970,BV1Z5kVBBE5J:35496985570,

function playBili(bvid){
  if(isDeployed){
    // GitHub Pages: use iframe (no volume control but music works)
    audioPlayer.style.display='none';
    biliPlayer.style.display='';
    biliPlayer.src = `https://player.bilibili.com/player.html?bvid=${bvid}&autoplay=1&high_quality=1&danmaku=0&muted=0`;
  } else {
    // Local proxy: fetch via our server, play via <audio> with real volume control
    const cid = CIDS[bvid];
    if(!cid){ fallbackIframe(bvid); return; }

    fetch(`/api/bili/playurl?bvid=${bvid}&cid=${cid}`)
      .then(r=>r.json())
      .then(data=>{
        if(!data.url){ fallbackIframe(bvid); return; }
        biliPlayer.style.display='none';
        audioPlayer.style.display='';
        audioPlayer.src = `/api/bili/stream?url=${encodeURIComponent(data.url)}`;
        audioPlayer.volume = isDJSpeaking ? 0.15 : 1.0;
        audioPlayer.play().catch(()=>{});
      })
      .catch(()=>{ fallbackIframe(bvid); });
  }
}

function fallbackIframe(bvid){
  audioPlayer.style.display='none';
  biliPlayer.style.display='';
  biliPlayer.src = `https://player.bilibili.com/player.html?bvid=${bvid}&autoplay=1&high_quality=1&danmaku=0&muted=0`;
}

function stopBili(){
  biliPlayer.src = '';
  audioPlayer.pause();
  audioPlayer.src = '';
}

function duckBili(){
  if(isDeployed) return;
  audioPlayer.volume = 0.15;
}

function restoreBili(){
  if(isDeployed) return;
  audioPlayer.volume = 1.0;
}

// ── Audio player with voice boost (Web Audio API) ──
let voiceCtx = null;
function getVoiceContext(){
  if(!voiceCtx) voiceCtx = new (window.AudioContext||window.webkitAudioContext)();
  if(voiceCtx.state === 'suspended') voiceCtx.resume();
  return voiceCtx;
}

function playAudioFile(src, onEnd){
  const ctx = getVoiceContext();
  const a = new Audio();
  a.src = src;
  a.crossOrigin = 'anonymous';

  // Boost Francis's voice through GainNode
  const source = ctx.createMediaElementSource(a);
  const gain = ctx.createGain();
  gain.gain.value = 2.5; // 2.5x amplification!
  source.connect(gain);
  gain.connect(ctx.destination);

  a.addEventListener('ended', () => {
    onEnd();
    try{source.disconnect();gain.disconnect()}catch(_){}
    a.remove();
  });
  a.addEventListener('error', () => {
    setTimeout(onEnd, 1500);
    try{source.disconnect();gain.disconnect()}catch(_){}
    a.remove();
  });
  a.play().catch(() => setTimeout(onEnd, 1500));
  return a;
}

// ── Play Sequence ──
// Flow: [Theme Intro] → [Track 1] → [Ad] → [Track 2] → [Track 3] → [Ad] → [Track 4] → [Track 5] → [Ad] → [Track 6] → [Loop]
// Ads inserted after tracks 1, 3, and 5 (every 2-3 songs)

function startSequence(){
  if(!isPlaying) return;
  currentVidIdx = 0;
  playThemeIntro();
}

function playThemeIntro(){
  if(!isPlaying) return;
  isDJSpeaking = true;
  djInd.classList.add('active');
  djLabel.textContent = 'Francis · 今日主题';
  adBadge.classList.remove('active');
  duckBili();

  introAudio = playAudioFile(`audio/theme-${dayKey}.mp3`, () => {
    isDJSpeaking = false;
    djInd.classList.remove('active');
    restoreBili();
    if(!isPlaying) return;
    playCurrentVideo();
  });
}

function playCurrentVideo(){
  if(!isPlaying) return;
  const v = getVideo();
  updateTrackDisplay(v);
  djInd.classList.remove('active');
  adBadge.classList.remove('active');
  disc.classList.add('playing');

  playBili(v.bvid);
  trackStartTime = Date.now();
  updateProgressUI();
  scheduleNext();
}

function playAd(){
  if(!isPlaying) return;
  isDJSpeaking = true;
  adBadge.classList.add('active');
  djInd.classList.remove('active');
  disc.classList.add('playing');
  duckBili();

  const adIdx = currentVidIdx % 4;
  adAudio = playAudioFile(`audio/ad-${adIdx}.mp3`, () => {
    isDJSpeaking = false;
    adBadge.classList.remove('active');
    restoreBili();
    if(!isPlaying) return;
    playCurrentVideo();
  });
}

function playTransition(){
  if(!isPlaying) return;
  isDJSpeaking = true;
  djInd.classList.add('active');
  djLabel.textContent = 'Francis';
  adBadge.classList.remove('active');
  disc.classList.add('playing');
  duckBili();

  const tIdx = currentVidIdx % 8;
  introAudio = playAudioFile(`audio/trans-${tIdx}.mp3`, () => {
    isDJSpeaking = false;
    djInd.classList.remove('active');
    restoreBili();
    if(!isPlaying) return;
    playCurrentVideo();
  });
}

function scheduleNext(){
  if(nextTimer) clearTimeout(nextTimer);
  const v = getVideo();
  const elapsed = (Date.now() - trackStartTime)/1000;
  const remaining = Math.max(5, v.dur - elapsed);
  nextTimer = setTimeout(() => {
    if(!isPlaying) return;
    currentVidIdx++;

    // Reset to start of day when all videos played
    if(currentVidIdx >= theme.videos.length) currentVidIdx = 0;

    // Insert ad after videos 1,3,5; transition after 2,4; theme replay at loop
    const idx = currentVidIdx % theme.videos.length;
    if(idx === 0) playThemeIntro();
    else if(idx === 1 || idx === 3 || idx === 5) playAd();
    else playTransition();
  }, remaining*1000);
}

function updateProgressUI(){
  const v = getVideo();
  const elapsed = (Date.now() - trackStartTime)/1000;
  const pct = Math.min(100, (elapsed/v.dur)*100);
  progressFill.style.width = pct+'%';
  timeEl.textContent = mmss(Math.min(elapsed, v.dur));
  timeTotal.textContent = mmss(v.dur);
}

// ── Controls ──
function play(){
  isPlaying = true;
  iconPlay.style.display='none';iconPause.style.display='';
  playBtn.setAttribute('aria-label','暂停');
  if(!progressTimer) progressTimer = setInterval(updateProgressUI, 300);
  initDay();
  startSequence();
}

function pause(){
  isPlaying = false;
  iconPlay.style.display='';iconPause.style.display='none';
  playBtn.setAttribute('aria-label','播放');
  if(progressTimer){clearInterval(progressTimer);progressTimer=null}
  if(nextTimer){clearTimeout(nextTimer);nextTimer=null}
  stopBili();
  if(introAudio){introAudio.pause();introAudio.src=''}
  if(adAudio){adAudio.pause();adAudio.src=''}
  isDJSpeaking=false;
  djInd.classList.remove('active');
  adBadge.classList.remove('active');
  disc.classList.remove('playing');
  restoreBili();
}

playBtn.addEventListener('click',()=>{hasInteracted=true;isPlaying?pause():play()});

nextBtn.addEventListener('click',()=>{
  if(nextTimer)clearTimeout(nextTimer);
  currentVidIdx++;
  if(currentVidIdx >= theme.videos.length) currentVidIdx = 0;
  if(isPlaying){
    if(introAudio){introAudio.pause();introAudio.src=''}if(adAudio){adAudio.pause();adAudio.src=''}
    isDJSpeaking=false;djInd.classList.remove('active');adBadge.classList.remove('active');
    playCurrentVideo();
  } else updateTrackDisplay(getVideo());
});

prevBtn.addEventListener('click',()=>{
  if(nextTimer)clearTimeout(nextTimer);
  currentVidIdx--;
  if(currentVidIdx < 0) currentVidIdx = theme.videos.length - 1;
  if(isPlaying){
    if(introAudio){introAudio.pause();introAudio.src=''}if(adAudio){adAudio.pause();adAudio.src=''}
    isDJSpeaking=false;djInd.classList.remove('active');adBadge.classList.remove('active');
    playCurrentVideo();
  } else updateTrackDisplay(getVideo());
});

progressBar.addEventListener('click',(e)=>{
  const rect = progressBar.getBoundingClientRect();
  const pct = (e.clientX - rect.left)/rect.width;
  const v = getVideo();
  trackStartTime = Date.now() - (pct*v.dur*1000);
  if(nextTimer){clearTimeout(nextTimer);nextTimer=null}
  scheduleNext();
});

document.addEventListener('keydown',(e)=>{
  if(e.target.tagName==='INPUT')return;
  switch(e.code){
    case'Space':e.preventDefault();hasInteracted=true;isPlaying?pause():play();break;
    case'ArrowRight':e.preventDefault();nextBtn.click();break;
    case'ArrowLeft':e.preventDefault();prevBtn.click();break;
  }
});

// ── Eq bars ──
(function buildEq(){
  let h='';
  for(let i=0;i<12;i++){h+=`<div class="eq-bar" style="height:${10+Math.random()*50}px;animation-delay:${(Math.random()*.4).toFixed(2)}s"></div>`}
  eqBars.innerHTML=h;
})();

// ── Autoplay ──
function tryAuto(){if(isPlaying){cleanup();return}cleanup();hasInteracted=true;play()}
function cleanup(){window.removeEventListener('pointerdown',tryAuto);window.removeEventListener('keydown',tryAuto);window.removeEventListener('touchstart',tryAuto)}
window.addEventListener('pointerdown',tryAuto);window.addEventListener('keydown',tryAuto);window.addEventListener('touchstart',tryAuto);
setTimeout(()=>{if(!hasInteracted&&!isPlaying)play()},800);

window.addEventListener('beforeunload',()=>{if(introAudio)introAudio.pause();if(adAudio)adAudio.pause()});

initDay();
